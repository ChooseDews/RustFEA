[workspace]
members = [".", "gui"]
resolver = "2"

[package]
name = "rust_fea"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }
nalgebra-sparse = "0.12"
faer = { version = "0.24", features = ["sparse-linalg"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
xz2 = "0.1"
zstd = "0.14"
typetag = "0.2"
bincode = "1.3"
log = "0.4"
env_logger = "0.11"
toml = "1.0"
rayon = "1.10"
indicatif = "0.18"
hdf5-writer = "0.9.1"

[dev-dependencies]
criterion = "0.5"

[lints.rust]
unused = "allow"
non_snake_case = "allow"

[profile.release]
opt-level = 3
debug = true

[profile.dev]
opt-level = 3
debug = true

[lib]
bench = false


[[bench]]
name = "main"
harness = false



[[test]]
name = "integration_tests"
path = "test/main.rs"
