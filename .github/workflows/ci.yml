name: CI Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            features: native
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: native
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: native

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --package rust_fea_gui --features ${{ matrix.features }} -- -D warnings
        continue-on-error: true  # Don't fail build on clippy warnings initially

      - name: Build library
        run: cargo build --package rust_fea --features native

      - name: Build GUI
        run: cargo build --package rust_fea_gui --features ${{ matrix.features }}

      - name: Run library tests
        run: cargo test --package rust_fea --features native

      - name: Build release
        run: cargo build --release --package rust_fea_gui --features ${{ matrix.features }}

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.92

      - name: Build WASM
        run: |
          cargo build \
            --target wasm32-unknown-unknown \
            --features wasm \
            --no-default-features \
            --release \
            --package rust_fea_gui

      - name: Generate JS bindings
        run: |
          wasm-bindgen \
            --out-dir gui/web/pkg \
            --target web \
            target/wasm32-unknown-unknown/release/rust_fea_gui.wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: gui/web/pkg/
