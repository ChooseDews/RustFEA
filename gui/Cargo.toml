[package]
name = "rust_fea_gui"
version = "0.1.0"
edition = "2021"
authors = ["RustFEA Contributors"]
description = "GUI for RustFEA - Finite Element Analysis in Rust"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rust_fea_gui"
path = "src/main.rs"

[features]
default = ["native"]
native = ["pollster", "rust_fea/native", "rfd", "rayon", "image"]
wasm = ["wasm-bindgen", "wasm-bindgen-futures", "web-sys", "console_error_panic_hook", "console_log", "rust_fea/wasm", "js-sys"]

[dependencies]
# Core FEA library
rust_fea = { path = "..", default-features = false }

# GUI Framework
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
]}

# 3D Rendering
wgpu = "23"
bytemuck = { version = "1.19", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }

# Math
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }

# File handling (native only)
rfd = { version = "0.15", optional = true }  # Native file dialogs
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# ZIP archive support
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Async runtime (native only)
pollster = { version = "0.4", optional = true }

# Image saving for screenshots (native only)
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

# Threading (native only)
rayon = { version = "1.10", optional = true }

# Web support (optional)
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Event",
    "MouseEvent",
]}
console_error_panic_hook = { version = "0.1", optional = true }
console_log = { version = "1.0", optional = true }

# For async file reading in WASM
js-sys = { version = "0.3", optional = true }

# Color handling for visualization
palette = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[build-dependencies]
# None needed for now

[profile.release]
opt-level = 3
lto = true

[profile.release-wasm]
inherits = "release"
opt-level = "s"
